services:
  sentinel-pocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-pocket
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - MOCK_MODE=${MOCK_MODE:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-mock_token}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:8080}
      - SENTINEL_ENDPOINT=${SENTINEL_ENDPOINT:-http://localhost:9090}
      - CANARYMESH_ENDPOINT=${CANARYMESH_ENDPOINT:-http://localhost:8000}
      - ALLOWED_TELEGRAM_USERS=${ALLOWED_TELEGRAM_USERS:-}
      - DATABASE_PATH=/data/sentinel_pocket.db
    volumes:
      - sentinel_pocket_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sentinel_pocket_data:
    name: sentinel_pocket_data
